name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ソース取得
      - uses: actions/checkout@v4

      # Javaセットアップ
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tailscale接続
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      # Tailscale疎通確認
      - name: Check Tailscale
        run: |
          tailscale status
          ping -c 3 ${{ secrets.HOST }}

      # SSH疎通確認
      - name: Check SSH Port
        run: |
          nc -zv ${{ secrets.HOST }} 22

      # テスト・ビルド・デプロイ
      - name: Test & Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e

            cd ~/workspace/nwproject_docker

            echo "===== Git Pull ====="
            git pull

            chmod +x mvnw

            echo "===== Unit Test ====="
            ./mvnw test

            echo "===== Build ====="
            ./mvnw clean install -DskipTests

            echo "===== Docker Deploy ====="
            cd .devcontainer
            docker compose up -d --build

            echo "===== Container Status ====="
            docker compose ps

            echo "===== Health Check ====="

            READY=false

            for i in {1..30}; do
              if curl -fsL http://localhost:8080/Login >/dev/null 2>&1; then
                READY=true
                break
              fi

              echo "Waiting... ($i/30)"
              sleep 2
            done

            if [ "$READY" = false ]; then
              echo "===== Tomcat Logs ====="
              docker logs my-tomcat --tail 200

              echo "===== Flyway Logs ====="
              docker logs devcontainer-flyway-1 --tail 100 || true

              exit 1
            fi

            echo "===== Deploy Complete ====="