name: Java CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node 
        uses: actions/setup-node@v4
        with: 
          node-version: 22

      - name: Create .env
        run: |
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_NAME=nwproject_db" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Build WAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: target/app.war

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Docker Build
        run: docker compose -f .devcontainer/docker-compose.yml build

      - name: Start Containers
        run: docker compose -f .devcontainer/docker-compose.yml up -d

      - name: Wait for Tomcat
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/Login; then
              echo "Tomcat started"
              exit 0
            fi
            echo "Waiting for Tomcat..."
            sleep 5
          done
          echo "Tomcat startup timeout"
          docker compose -f .devcontainer/docker-compose.yml logs
          exit 1

      - name: Run Playwright Tests 
        run: npx playwright test

      - name: Upload Playwright Report 
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

      - name: Show Container Logs
        if: failure()
        run: docker compose -f .devcontainer/docker-compose.yml logs

      - name: Shutdown Containers
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down
