services:
  qiita-guide:
    build:
      context: ../../AI_Support
      dockerfile: ../nwproject_docker/.devcontainer/Dockerfile.qiita-guide
    container_name: qiita-guide
    env_file:
      - ../../AI_Support/.env
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/status').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
