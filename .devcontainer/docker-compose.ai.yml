services:
  tomcat:
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-token}
    depends_on:
      ai-service:
        condition: service_healthy

  ai-service:
    build:
      context: ../../My-AiCreate
      dockerfile: Dockerfile
    container_name: my-ai-create
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-180}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.7}
      AI_ONLINE: ${AI_ONLINE:-false}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 10
